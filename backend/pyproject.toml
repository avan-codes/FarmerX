[project]
name = "farmerx-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "pydantic-settings>=2.3", "filelock>=3.13", "python-multipart>=0.0.9",
  "httpx>=0.27", "jinja2>=3.1", "weasyprint>=62", "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27",
       "fonttools>=4.50", "pypdf>=4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
